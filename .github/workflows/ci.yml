name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: x-tech-laboratories/X-App/.github/actions/app-ci@main

  # Builds the package TechNet deploys and the desktop app, so a dependency bump that breaks either fails here.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: x-tech-laboratories/X-App/.github/actions/app-nix@main
        with:
          targets: ./nix#default ./nix#desktop

  # Every push to main builds the Android package once the tests pass, signed when the repository holds the release
  # key, and a version tag such as v1.2.3 publishes it as a release, which Obtainium follows.
  android:
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: x-tech-laboratories/X-App/.github/actions/app-android@main
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
