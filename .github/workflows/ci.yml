name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: x-tech-laboratories/X-App/.github/actions/app-ci@main

  # Builds the package TechNet deploys and the desktop app, so a dependency bump that breaks either fails here.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: x-tech-laboratories/X-App/.github/actions/app-nix@main
        with:
          targets: ./nix#default ./nix#desktop
