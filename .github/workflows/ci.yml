name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - run: npm test
      - run: npm run lint

  # Every push to main or a version tag builds the Android package once the tests pass, signed when the repository
  # holds the release key; a version tag must be signed.
  android:
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release-keystore"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::A release needs the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export ANDROID_VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            export ANDROID_VERSION_NAME="$(jq -r .version package.json)-${GITHUB_SHA::7}"
          fi
          nix develop .#android --command bash -c 'npm ci && npm run build:android && cd android && ./gradlew assembleRelease'
          cp android/app/build/outputs/apk/release/app-release*.apk x-budget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: x-budget.apk

  # A version tag such as v1.2.3 publishes the signed package as a GitHub release, which Obtainium follows.
  release:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" x-budget.apk --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "X-Budget ${GITHUB_REF_NAME#v}" --generate-notes
